name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check . --output-format=github
        continue-on-error: true

      # Network-marked tests hit live endpoints (Deribit, Binance futures,
      # Yahoo) that are rate-limited and geo-restricted, so they are excluded
      # from CI rather than allowed to fail the build for reasons unrelated to
      # the change under review.
      - name: Test
        run: pytest tests/ -q --no-header -m "not network"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block committed secrets
        run: |
          if git grep -nIE "(api[_-]?key|secret|token|password)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_-]{24,}" \
               -- ':!tests/*' ':!*.md' ':!.github/*' ; then
            echo "::error::Possible credential committed. Use .env (gitignored)."
            exit 1
          fi
          echo "No credential-shaped strings found outside tests."

  bigfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block files over 50 MB
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +50M -print)
          if [ -n "$big" ]; then
            echo "::error::Files over 50 MB: $big"
            exit 1
          fi
          echo "No oversized files."
