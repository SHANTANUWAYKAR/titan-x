name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 ONLY, and this is a real constraint rather than a preference.
        # pandas-ta 0.4.71b0 requires >=3.12, and numpy 1.26.x (pinned <2, see
        # requirements.txt) publishes no prebuilt wheel for 3.13+ -- building it
        # from source needs GCC >= 8.4. A 3.11 entry here can never pass.
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # requirements.txt CANNOT be installed in one pass on a fresh environment,
      # and this is documented at the top of that file. pandas-ta 0.4.71b0
      # declares `numpy>=2.2.6` metadata while this project requires numpy<2; on
      # a brand-new venv pip treats that metadata as authoritative and fails with
      # ResolutionImpossible. pandas-ta runs correctly against numpy<2 in
      # practice, so it is installed last with --no-deps.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          grep -v '^pandas-ta==' requirements.txt > /tmp/requirements-no-pandas-ta.txt
          pip install -r /tmp/requirements-no-pandas-ta.txt
          pip install pandas-ta==0.4.71b0 --no-deps
          pip install -e . --no-deps
          pip install pytest ruff

      # Informational: `pip check` reports pandas-ta/numpy and pandas-ta/numba
      # metadata mismatches by design (see the Install note). Surfaced so a real,
      # new conflict is still visible, but never allowed to fail the build.
      - name: Dependency check (informational)
        run: pip check || true

      - name: Lint
        run: ruff check . --output-format=github
        continue-on-error: true

      # Network-marked tests hit live endpoints (Deribit, Binance futures,
      # Yahoo) that are rate-limited and geo-restricted, so they are excluded
      # from CI rather than allowed to fail the build for reasons unrelated to
      # the change under review.
      - name: Test
        run: pytest tests/ -q --no-header -m "not network"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Block committed secrets
        run: |
          if git grep -nIE "(api[_-]?key|secret|token|password)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_-]{24,}" \
               -- ':!tests/*' ':!*.md' ':!.github/*' ; then
            echo "::error::Possible credential committed. Use .env (gitignored)."
            exit 1
          fi
          echo "No credential-shaped strings found outside tests."

  bigfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Block files over 50 MB
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +50M -print)
          if [ -n "$big" ]; then
            echo "::error::Files over 50 MB: $big"
            exit 1
          fi
          echo "No oversized files."
